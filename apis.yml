aid: backerkit
name: Backerkit
description: >-
  BackerKit is a crowdfunding and pledge-management platform for professional
  creators. It began as backer-survey and data-management software that helps
  creators who funded projects on Kickstarter and Indiegogo collect shipping
  addresses, sell add-ons and pre-orders, charge cards, and manage backer data
  for reward fulfillment. It has since grown into a full crowdfunding platform
  of its own, powering campaigns end to end and, in 2024, roughly one in every
  four dollars raised on Kickstarter. BackerKit is a Y Combinator company. It
  exposes integration API keys (API key, secret, and Store GUID) so creators can
  connect fulfillment services such as ShipStation, but it does not publish a
  public, self-serve developer API, OpenAPI definition, or SDKs; developer
  access is account-scoped and configured inside the BackerKit dashboard.
